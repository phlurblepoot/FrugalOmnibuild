name: Docker CUDA Image CI

# Builds the GPU image (Dockerfile.cuda) and publishes two moving GPU tags,
# mirroring how the CPU image tags branches:
#   * ghcr.io/<repo>:cuda         -> tracks `testing` (your live/dev GPU box)
#   * ghcr.io/<repo>:cuda-stable  -> tracks `main`    (stable release GPU image)
# Plus a :cuda-<sha> on every build for traceability. Every push to testing
# rebuilds :cuda; every push to main (i.e. a testing->main merge) rebuilds
# :cuda-stable. You can also build on demand:
#   * Actions tab -> "Docker CUDA Image CI" -> Run workflow (any branch), OR
#   * push a git tag matching `cuda-*` (e.g. `git tag cuda-1 && git push origin cuda-1`).
# On-demand/tag builds off a non-main ref publish :cuda.
# GPU builds are large/slow; GHA layer caching keeps incremental builds faster.
# Point your Unraid container's Repository at :cuda (dev) or :cuda-stable
# (stable) and re-pull to update.

on:
  workflow_dispatch:
  push:
    branches: [ "testing", "main" ]
    tags: [ 'cuda-*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-cuda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-cuda-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        # CUDA base images are large; reclaim space so the build doesn't run out.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af || true
          df -h

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cuda-stable,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=cuda,enable=${{ github.ref != 'refs/heads/main' }}
            type=sha,prefix=cuda-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push CUDA Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.cuda
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cuda
          cache-to: type=gha,mode=max,scope=cuda
